<!DOCTYPE html>
<html lang="en">

<head>

    <title>Parking Tracking</title>

    <style>

            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        #corporateparking_parso_cr_1,
        #corporateparking_parso_cr_2 {
            margin: 5px;

            border-radius: 5px;

        #refreshButton {

            color: white;

        #list {

        }

        #validCredentialString {

        #reservationsSection {
            margin: 20px;
            padding: 20px;

            border-radius: 10px;

        #reservationsSection h2 {
            margin-top: 0;
            font-size: 1.1rem;

        #reservationsTable {

        #reservationsTable th,

        .btn-delete {

            border: none;

            font-size: 0.85rem;
        }

        #modalOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        #modalOverlay.active { display: flex; }
        #modalDialog {
            background: white;
            border-radius: 10px;
            padding: 24px 28px;
            min-width: 320px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        #modalDialog h3 { margin-top: 0; }
        #modalDialog .modal-actions { margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end; }
        #btnConfirmReservation {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        #btnCancelModal {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        #parkingChart { cursor: pointer; }
    </style>
</head>

<body>

    <section id="reservationsSection" style="display:none">
        <h2>Reservas existentes</h2>
        <table id="reservationsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Fecha</th>

                    <th>Placa</th>
                    <th></th>

            </thead>

        </table>
    </section>

    <section id="chart" style="display:none">
        <!-- Crear un elemento canvas para el grafico -->
        <canvas id="parkingChart" width="400" height="200"></canvas>
    </section>

    <div id="modalOverlay">
        <div id="modalDialog">
            <h3>Reservar espacio</h3>
            <p id="modalInfo"></p>
            <label for="reservationReason">Razón:</label>
            <input id="reservationReason" type="text" value="Jornada Laboral" style="width:100%;margin:6px 0 12px;padding:6px;border-radius:5px;border:1px solid #ccc;box-sizing:border-box">
            <label for="vehicleSelect">Vehículo:</label>

            <div class="modal-actions">
                <button id="btnCancelModal">Cancelar</button>
                <button id="btnConfirmReservation">Confirmar reserva</button>
            </div>
        </div>
    </div>

    <section id="autoReserveSection" style="display:none;margin:20px;padding:20px;background-color:white;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,0.1);">
        <h2 style="margin-top:0;font-size:1.1rem;color:#333;">Auto-reserva semanal (B10)</h2>
        <p style="font-size:0.85rem;color:#666;margin:0 0 10px 0;">Reserva automáticamente el mismo día de la próxima semana al iniciar sesión, si hay un espacio B10 libre. Sin acción si ya existe una reserva para esa fecha.</p>
        <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center;">
            <label><input type="checkbox" id="auto_lunes"     data-day="1"> Lunes</label>
            <label><input type="checkbox" id="auto_martes"    data-day="2"> Martes</label>
            <label><input type="checkbox" id="auto_miercoles" data-day="3"> Miércoles</label>
            <label><input type="checkbox" id="auto_jueves"    data-day="4"> Jueves</label>
            <label><input type="checkbox" id="auto_viernes"   data-day="5"> Viernes</label>
        </div>
        <div style="margin-top:10px;">
            <label style="font-size:0.85rem;">Vehículo por defecto:
                <select id="autoReserveVehicleSelect" style="margin-left:6px;padding:4px 6px;border-radius:4px;border:1px solid #ccc;"></select>

    <section id="loginForm">

        <!-- Campos de entrada para email y contrasena -->
        <input id="corporateparking_parso_cr_1" type="email">
        <input id="corporateparking_parso_cr_2" type="password">
        <button id="refreshButton">Autenticar</button>
        <span id="validCredentialString"> </span>

        <div id="loadingTasks">
            <ul id="list"></ul>
        </div>

    </section>

    <script>

        const SATURDAY = 6;
        const SUNDAY = 0;
        let allParkingData = [];

        // Funcion para obtener las fechas de los proximos 10 dias habiles a partir de manana
        function getNextWeekdays() {
            const dates = [];

            // obtener la fecha de hoy a las 8 am
            const today = new Date();
            today.setHours(8, 0, 0, 0);

            while (dates.length < 6) {
                today.setDate(today.getDate() + 1);

                if (today.getDay() !== SUNDAY && today.getDay() !== SATURDAY) { // Excluir fines de semana
                    dates.push(new Date(today));
                }
            }
            return dates;
        }

        // Funcion para formatear la fecha en el formato requerido por la API
        function getStartOfDay(date) {
            // Las 8:00 de la manana GMT-6 en formato ISO 8601
            return date.toISOString().split('T')[0] + 'T14:00:00.000Z';
        }

        // obtiene la etiqueta de la columna en formato dia de la semana y numero de dia
        function getColumnLabel(date) {
            const days = ['Domingo', 'Lunes', 'Martes', 'Miercoles', 'Jueves', 'Viernes', 'Sabado'];
            return days[date.getDay()] + ' ' + date.getDate();
        }

        function formatDateWithIndicator(dateStr) {
            const hasTime = dateStr.includes('T') || dateStr.includes(' ');
            const date = new Date(hasTime ? dateStr : dateStr + 'T14:00:00.000Z'); // 8:00 a. m. GMT-6
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const dateOnly = new Date(date);
            dateOnly.setHours(0, 0, 0, 0);
            const diffDays = Math.round((dateOnly - today) / 86400000);
            let indicator;
            if (diffDays === 0) indicator = 'Hoy';
            else if (diffDays === 1) indicator = 'Mañana';
            else if (diffDays === -1) indicator = 'Ayer';
            else if (diffDays > 0) indicator = `En ${diffDays} días`;
            else indicator = `Hace ${Math.abs(diffDays)} días`;
            const timeStr = date.toLocaleTimeString('es-CR', { hour: '2-digit', minute: '2-digit' });
            return `${dateStr} ${timeStr} <small style="color:#888">(${indicator})</small>`;
        }


        // Funcion para autenticar al usuario y almacenar los tokens
        async function authenticate(email, password) {

            // agregar item a la lista para indicar que esta haciendo login
            const item = document.createElement('li');
            item.textContent = 'Iniciando sesion con el usuario ' + email + '...';
            document.getElementById('list').appendChild(item);

            const response = await fetch('https://baclatam.corporateparking.parso.cr/api/auth/sign_in', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: email, password: password })
            });


            //validar la respuesta
            if (response.status !== 200) {
                const item = document.createElement('li');
                item.textContent = 'Error al iniciar sesion con el usuario ' + email;
                document.getElementById('list').appendChild(item);
                return;
            }


            const jsonData = await response.json();

            const info = {
                'access-token': jsonData.tokens[0].token["access-token"],
                'token-type': jsonData.tokens[0].token["token-type"],
                'client': jsonData.tokens[0].token["client"],
                'uid': jsonData.tokens[0].token["uid"],
                'expiry': jsonData.tokens[0].token["expiry"]
            };
            localStorage.setItem('parso_token', JSON.stringify(info));
        }

        // Funcion para obtener los datos de disponibilidad de parqueos
        async function getParkingData() {
            const dates = getNextWeekdays();
            const tokens = JSON.parse(localStorage.getItem('parso_token'));

            const results = await Promise.all(dates.map(async date => {
                const formattedDate = getStartOfDay(date);

                const item = document.createElement('li');
                item.textContent = 'Cargando datos para el dia ' + getColumnLabel(date) + ' (' + date.toISOString().split('T')[0] + ')';
                document.getElementById('list').appendChild(item);

                const response = await fetch(`https://baclatam.corporateparking.parso.cr/api/parking_spaces/availability?start_date=${formattedDate}&end_date=${formattedDate}&entry_time=08:00`, {
                    headers: {
                        'access-token': tokens['access-token'],
                        'token-type': tokens['token-type'],
                        'client': tokens['client'],
                        'uid': tokens['uid'],
                        'expiry': tokens['expiry']
                    }
                });

                if (response.status === 401) {
                    localStorage.removeItem('parso_token');
                    document.getElementById('refreshButton').disabled = false;
                    const errItem = document.createElement('li');
                    errItem.textContent = 'Credenciales invalidas, por favor autentique de nuevo';
                    document.getElementById('list').appendChild(errItem);
                    return null;
                }

                if (response.status !== 200) {
                    const errItem = document.createElement('li');
                    errItem.textContent = 'Error al cargar datos para el dia ' + getColumnLabel(date) + ' (' + date.toISOString().split('T')[0] + ')';
                    document.getElementById('list').appendChild(errItem);
                    return null;
                }

                const data = await response.json();
                if (data.success === true) {
                    const lots = [];
                    data.availables[0].availability.forEach(element => {
                        lots[element.parking_lot_id] = element;
                    });
                    return {
                        label: getColumnLabel(date),
                        date: data.availables[0].date,
                        lots: lots
                    };
                }
                return null;
            }));

            return results.filter(Boolean);
        }

let count = 1;

function stringToRgb(text) {
  let hash = 0;


  // pasar text a un hashcode como el de java
  
  text = text + count +"0" + count +"0"+ count +"0"+ count;
  count++;  

  for (let i = 0; i < text.length; i++) {
    hash = text.charCodeAt(i) + ((hash << 5) - hash);
    hash |= 0; // Fuerza a entero de 32 bits
  }

  const r = (hash >> 16) & 255;
  const g = (hash >> 8) & 255;
  const b = hash & 255;

  return `rgb(${Math.abs(r)}, ${Math.abs(g)}, ${Math.abs(b)})`;
}

        // Funcion para configurar y mostrar el grafico
        async function renderChart() {


            const parkingData = await getParkingData();
            allParkingData = parkingData;


            // ARREGLO DE COLORES DISTINTOS PARA CADA LOTE DE PARQUEO
            const colors = [
                'rgba(255, 99, 132, 0.2)',
                'rgba(54, 162, 235, 0.2)',
                'rgba(255, 206, 86, 0.2)',
                'rgba(75, 192, 192, 0.2)',
                'rgba(153, 102, 255, 0.2)',
                'rgba(255, 159, 64, 0.2)',
                'rgba(255, 99, 132, 0.2)',
                'rgba(54, 162, 235, 0.2)',
                'rgba(255, 206, 86, 0.2)',
                'rgba(75, 192, 192, 0.2)',
                'rgba(153, 102, 255, 0.2)',
                'rgba(255, 159, 64, 0.2)'
            ];

            

                                                      
            const labels = parkingData.map(item => item.label);


            // Crear definicion de los datasets
            const firstElement = parkingData[0];
            const datasets = [];

            for (const lot of Object.values(firstElement.lots)) {

                // convertir nombre del lote en un numero hash
                let hash = (lot.name.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0)) % 12;



                // cambia el nombre del lote en un numero entre 0 y 11 para que sea mas facil de leer en la leyenda del grafico
                let colorIndex = hash % colors.length;
            
                datasets.push({
                    id: lot.parking_lot_id,
                    label: lot.name,
                    data: [],
                    backgroundColor: colors[colorIndex],
                    borderColor: 'rgba(0, 0, 0, 1)',
                    borderWidth: 1
                });
            }



            // Alimentar cada dataset con datos para cada dia de la semana
            parkingData.forEach(item => {

                //buscar el item dentro del arreglo que tenga el label que corresponde al item

                for (let i = 0; i < datasets.length; i++) {
                    const data = item.lots[datasets[i].id];
                    if (data) {
                        datasets[i].data.push(data.total);
                    }
                }


            });


            const ctx = document.getElementById('parkingChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    onClick: async (event, elements, chart) => {
                        if (!elements.length) return;
                        const { datasetIndex, index } = elements[0];
                        const lot = chart.data.datasets[datasetIndex];
                        await openReservationModal(lot.id, lot.label, allParkingData[index].date);
                    },
                    scales: {
                        x: {
                            stacked: true
                        },
                        y: {
                            beginAtZero: true,
                            stacked: true
                        }
                    }
                }
            });

            document.getElementById("loginForm").style.display = "none";
            document.getElementById("chart").style.display = "block";

            await renderReservations();
            await fetchVehicles();
            await runAutoReserve();
        }

        async function renderReservations() {
            const tokens = JSON.parse(localStorage.getItem('parso_token'));
            const response = await fetch('https://baclatam.corporateparking.parso.cr/api/reservations', {
                headers: {
                    'accept': 'application/json, text/plain, */*',
                    'access-token': tokens['access-token'],
                    'client': tokens['client'],
                    'token-type': tokens['token-type'],
                    'uid': tokens['uid']
                },
                method: 'GET',
                mode: 'cors',
                credentials: 'omit',
                cache: 'no-store'
            });

            if (!response.ok) return;

            const data = await response.json();
            if (!data.success || !data.reservations) return;

            const tbody = document.getElementById('reservationsBody');
            tbody.innerHTML = '';

            data.reservations.forEach(r => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${r.id}</td>
                    <td>${formatDateWithIndicator(r.reservation_date)}</td>
                    <td><span class="status-${r.status}">${r.status}</span></td>
                    <td>${r.reason}</td>
                    <td>${r.parking_space?.parking_space_label ?? ''}</td>
                    <td>${r.parking_space?.parking_lot_name ?? ''}</td>
                    <td>${r.vehicle?.license_plate ?? ''}</td>
                    <td><button class="btn-delete" data-id="${r.id}">Eliminar</button></td>
                `;
                tbody.appendChild(tr);
            });

            tbody.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', () => deleteReservation(parseInt(btn.dataset.id)));
            });

            document.getElementById('reservationsSection').style.display = 'block';
        }

        async function deleteReservation(id) {
            if (!confirm(`¿Eliminar reserva #${id}?`)) return;
            const tokens = JSON.parse(localStorage.getItem('parso_token'));
            const response = await fetch(`https://baclatam.corporateparking.parso.cr/api/parking_reservations/${id}`, {
                method: 'DELETE',
                headers: {
                    'accept': 'application/json, text/plain, */*',
                    'access-token': tokens['access-token'],
                    'client': tokens['client'],
                    'token-type': tokens['token-type'],
                    'uid': tokens['uid']
                },
                mode: 'cors',
                credentials: 'omit'
            });
            if (response.ok) {
                await renderReservations();
            } else {
                alert('Error al eliminar la reserva.');
            }
        }

        async function openReservationModal(lotId, lotName, date) {
            document.getElementById('modalInfo').textContent =
                `¿Reservar en "${lotName}" para el ${date} a las 08:00?`;
            document.getElementById('modalError').style.display = 'none';
            await fetchVehicles();
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('btnConfirmReservation').onclick = () => makeReservation(lotId, date);
        }

        function refreshAutoReserveSection() {
            const cached = JSON.parse(localStorage.getItem('parso_vehicles') || 'null');
            const section = document.getElementById('autoReserveSection');
            if (!cached || !cached.length) {
                section.style.display = 'none';
                return;
            }
            section.style.display = 'block';
            const arSelect = document.getElementById('autoReserveVehicleSelect');
            arSelect.innerHTML = '';
            cached.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.id;
                opt.textContent = v.label;
                arSelect.appendChild(opt);
            });
            const saved = localStorage.getItem('parso_vehicle_id');
            if (saved) arSelect.value = saved;
            arSelect.onchange = () => localStorage.setItem('parso_vehicle_id', arSelect.value);
        }

        async function fetchVehicles() {
            const tokens = JSON.parse(localStorage.getItem('parso_token'));
            const response = await fetch('https://baclatam.corporateparking.parso.cr/api/vehicles', {
                headers: {
                    'accept': 'application/json, text/plain, */*',
                    'access-token': tokens['access-token'],
                    'client': tokens['client'],
                    'token-type': tokens['token-type'],
                    'uid': tokens['uid']
                },
                method: 'GET',
                mode: 'cors',
                credentials: 'omit'
            });
            const modalSelect = document.getElementById('vehicleSelect');
            modalSelect.innerHTML = '';
            let vehicles = JSON.parse(localStorage.getItem('parso_vehicles') || '[]');
            if (response.ok) {
                const data = await response.json();
                if (data.success && data.vehicles) {
                    vehicles = data.vehicles.map(v => {
                        let label = v.license_plate;
                        if (v.vehicle_type) label += ` (${v.vehicle_type})`;
                        if (v.vehicle_dimension > 0) label += ` · tamaño ${v.vehicle_dimension}`;
                        return { id: v.id, label };
                    });
                    localStorage.setItem('parso_vehicles', JSON.stringify(vehicles));
                }
            }
            vehicles.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.id;
                opt.textContent = v.label;
                modalSelect.appendChild(opt);
            });
            const saved = localStorage.getItem('parso_vehicle_id');
            if (saved) modalSelect.value = saved;
            modalSelect.onchange = () => {
                localStorage.setItem('parso_vehicle_id', modalSelect.value);
                // Sync default to auto-reserve selector
                const arSelect = document.getElementById('autoReserveVehicleSelect');
                if (arSelect) arSelect.value = modalSelect.value;
            };
            refreshAutoReserveSection();
        }

        document.getElementById('btnCancelModal').addEventListener('click', () => {
            document.getElementById('modalOverlay').classList.remove('active');
        });

        function loadAutoReserveSettings() {
            const saved = JSON.parse(localStorage.getItem('parso_autoreserve_days') || '[]');
            document.querySelectorAll('[data-day]').forEach(cb => {
                cb.checked = saved.includes(parseInt(cb.dataset.day));
                cb.addEventListener('change', saveAutoReserveSettings);
            });
            refreshAutoReserveSection();
        }

        function saveAutoReserveSettings() {
            const enabled = Array.from(document.querySelectorAll('[data-day]:checked'))
                .map(cb => parseInt(cb.dataset.day));
            localStorage.setItem('parso_autoreserve_days', JSON.stringify(enabled));
        }

        function setAutoReserveStatus(msg, isError) {
            const el = document.getElementById('autoReserveStatus');
            el.textContent = msg;
            el.style.color = isError ? '#dc3545' : '#28a745';
        }

        async function runAutoReserve() {
            const today = new Date();
            const todayDay = today.getDay(); // 0=Dom, 1=Lun … 6=Sáb

            if (todayDay === 0 || todayDay === 6) return;

            const enabledDays = JSON.parse(localStorage.getItem('parso_autoreserve_days') || '[]');
            if (!enabledDays.includes(todayDay)) return;

            // Próximo mismo día de semana = hoy + 7 días
            const targetDate = new Date(today);
            targetDate.setDate(today.getDate() + 7);
            targetDate.setHours(8, 0, 0, 0);
            const targetDateStr = targetDate.toISOString().split('T')[0];

            setAutoReserveStatus('Verificando auto-reserva para ' + targetDateStr + '...');

            const tokens = JSON.parse(localStorage.getItem('parso_token'));

            // Verificar si ya existe una reserva para esa fecha
            const resResponse = await fetch('https://baclatam.corporateparking.parso.cr/api/reservations', {
                headers: {
                    'accept': 'application/json, text/plain, */*',
                    'access-token': tokens['access-token'],
                    'client': tokens['client'],
                    'token-type': tokens['token-type'],
                    'uid': tokens['uid']
                },
                method: 'GET',
                mode: 'cors',
                credentials: 'omit',
                cache: 'no-store'
            });

            if (!resResponse.ok) {
                setAutoReserveStatus('Auto-reserva: error al verificar reservas existentes.', true);
                return;
            }

            const resData = await resResponse.json();
            if (resData.success && resData.reservations) {
                const alreadyBooked = resData.reservations.some(r => {
                    const rDate = (r.reservation_date || '').split('T')[0];
                    return rDate === targetDateStr && r.status !== 'REJECTED';
                });
                if (alreadyBooked) {
                    setAutoReserveStatus('Ya existe una reserva para el ' + targetDateStr + '. Sin acción.');
                    return;
                }
            }

            // Obtener disponibilidad para la fecha objetivo
            const formattedDate = getStartOfDay(targetDate);
            const availResponse = await fetch(
                'https://baclatam.corporateparking.parso.cr/api/parking_spaces/availability?start_date=' + formattedDate + '&end_date=' + formattedDate + '&entry_time=08:00',
                {
                    headers: {
                        'access-token': tokens['access-token'],
                        'token-type': tokens['token-type'],
                        'client': tokens['client'],
                        'uid': tokens['uid'],
                        'expiry': tokens['expiry']
                    }
                }
            );

            if (!availResponse.ok) {
                setAutoReserveStatus('Auto-reserva: error al obtener disponibilidad.', true);
                return;
            }

            const availData = await availResponse.json();
            if (!availData.success || !availData.availables || !availData.availables[0]) {
                setAutoReserveStatus('Auto-reserva: sin datos de disponibilidad.', true);
                return;
            }

            // Primer lote con "B10" en el nombre que tenga espacios libres
            const b10Lot = availData.availables[0].availability.find(
                lot => lot.name.includes('B10') && lot.total > 0
            );

            if (!b10Lot) {
                setAutoReserveStatus('No hay espacios B10 disponibles para el ' + targetDateStr + '.', true);
                return;
            }

            const vehicleId = parseInt(document.getElementById('autoReserveVehicleSelect').value || '0');
            if (!vehicleId) {
                setAutoReserveStatus('Auto-reserva: no hay vehículo guardado. Reserve manualmente primero.', true);
                return;
            }

            const body = {
                parking_reservation: {
                    parking_lot_id: b10Lot.parking_lot_id,
                    reason: 'Jornada Laboral',
                    vehicle_id: vehicleId,
                    entry_time: '08:00'
                },
                dates: [availData.availables[0].date]
            };

            const reserveResponse = await fetch('https://baclatam.corporateparking.parso.cr/api/parking_reservations/multiples', {
                method: 'POST',
                headers: {
                    'accept': 'application/json, text/plain, */*',
                    'content-type': 'application/json',
                    'access-token': tokens['access-token'],
                    'client': tokens['client'],
                    'token-type': tokens['token-type'],
                    'uid': tokens['uid']
                },
                body: JSON.stringify(body),
                mode: 'cors',
                credentials: 'omit'
            });

            if (reserveResponse.ok) {
                setAutoReserveStatus('✓ Auto-reserva realizada en "' + b10Lot.name + '" para el ' + targetDateStr + '.');
                await renderReservations();
            } else {
                const err = await reserveResponse.json().catch(() => ({}));
                setAutoReserveStatus('Error al auto-reservar: ' + (err.message || 'desconocido'), true);
            }
        }

        async function makeReservation(lotId, date) {
            const tokens = JSON.parse(localStorage.getItem('parso_token'));
            const selectedVehicleId = parseInt(document.getElementById('vehicleSelect').value);
            if (!selectedVehicleId) {
                document.getElementById('modalError').textContent = 'Seleccione un vehículo.';
                document.getElementById('modalError').style.display = 'block';
                return;
            }
            const body = {
                parking_reservation: {
                    parking_lot_id: lotId,
                    reason: document.getElementById('reservationReason').value || 'Jornada Laboral',
                    vehicle_id: selectedVehicleId,
                    entry_time: '08:00'
                },
                dates: [date]
            };
            const response = await fetch('https://baclatam.corporateparking.parso.cr/api/parking_reservations/multiples', {
                method: 'POST',
                headers: {
                    'accept': 'application/json, text/plain, */*',
                    'content-type': 'application/json',
                    'access-token': tokens['access-token'],
                    'client': tokens['client'],
                    'token-type': tokens['token-type'],
                    'uid': tokens['uid']
                },
                body: JSON.stringify(body),
                mode: 'cors',
                credentials: 'omit'
            });
            if (response.ok) {
                document.getElementById('modalOverlay').classList.remove('active');
                await renderReservations();
            } else {
                const err = await response.json().catch(() => ({}));
                document.getElementById('modalError').textContent = err.message || 'Error al realizar la reserva.';
                document.getElementById('modalError').style.display = 'block';
            }
        }

        function credentialsValid() {
            const parso_token = localStorage.getItem('parso_token');
            if (parso_token) {
                const credentials = JSON.parse(parso_token);


                //Obtener fecha actual en formato epoch
                const fechaActual = Math.floor(new Date().getTime() / 1000);


                if (parseInt(credentials.expiry) > fechaActual) {
                    return true;
                } else {
                    localStorage.removeItem('parso_token');
                    return false;
                }

            } else {
                return false;
            }
        }


        // Funcion para manejar el clic en el boton de refrescar
        document.getElementById('refreshButton').addEventListener('click', async () => {
            const email = document.getElementById('corporateparking_parso_cr_1').value;
            const password = document.getElementById('corporateparking_parso_cr_2').value;
            if (!credentialsValid()) {
                await authenticate(email, password);
            }
            renderChart();
        });

        loadAutoReserveSettings();

        // Renderizar el grafico al cargar la pagina si ya esta autenticado
        if (credentialsValid()) {

            const expiryDate = new Date(parseInt(JSON.parse(localStorage.getItem('parso_token')).expiry) * 1000);

            document.getElementById('refreshButton').enabled = false;
            document.getElementById('validCredentialString').innerText = 'Credenciales obtenidas expiran hasta el ' + getColumnLabel(expiryDate) + ' (' + expiryDate.toLocaleString() + ')';


            renderChart();


        }
    </script>
</body>

</html>
